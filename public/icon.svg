<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Equalizer Audio Waveform Bars (Center) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="120" y="270" width="24" height="70" rx="12" fill="url(#neonCyan)"/>
    <!-- Bar 2 -->
    <rect x="160" y="210" width="24" height="130" rx="12" fill="url(#neonCyan)"/>
    <!-- Bar 3 -->
    <rect x="200" y="150" width="24" height="190" rx="12" fill="url(#neonIndigo)"/>
    <!-- Bar 4 (Peak) -->
    <rect x="244" y="110" width="24" height="230" rx="12" fill="url(#neonIndigo)"/>
    <!-- Bar 5 -->
    <rect x="288" y="170" width="24" height="170" rx="12" fill="url(#neonPink)"/>
    <!-- Bar 6 -->
    <rect x="328" y="230" width="24" height="110" rx="12" fill="url(#neonPink)"/>
    <!-- Bar 7 -->
    <rect x="368" y="280" width="24" height="60" rx="12" fill="url(#neonCyan)"/>
  </g>

  <!-- Soundwave Connecting Line -->
  <path d="M 96 360 C 160 360, 200 375, 256 375 C 312 375, 352 360, 416 360" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="375" r="7" fill="#38bdf8"/>

  <!-- Headphone Arc Silhouette -->
  <path d="M 120 220 A 136 136 0 0 1 392 220" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
</svg>
